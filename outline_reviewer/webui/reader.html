<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说阅读器 — NoverGen</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3345;
  --text: #e1e4ed;
  --text2: #9ca3b4;
  --accent: #6c8cff;
  --accent2: #4a6cf7;
  --red: #f87171;
  --amber: #fbbf24;
  --green: #34d399;
  --blue: #60a5fa;
  --radius: 8px;
  --sidebar-w: 260px;
  --read-max-w: 720px;
}
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Top Bar ── */
#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; height: 48px;
}
#topbar h1 { font-size: 15px; font-weight: 600; color: var(--text); }
#topbar .spacer { flex: 1; }
.nav-link {
  color: var(--text2); text-decoration: none; font-size: 13px;
  padding: 4px 10px; border-radius: 4px; transition: color .15s, background .15s;
}
.nav-link:hover { color: var(--text); background: var(--surface2); }
.nav-link.active { color: var(--accent); }

/* ── Layout ── */
#app { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
#sidebar-header {
  padding: 12px 14px; font-size: 12px; font-weight: 600;
  text-transform: uppercase; color: var(--text2);
  letter-spacing: .05em; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
  cursor: pointer;
}
#novel-list { flex: 1; overflow-y: auto; }
.novel-group { border-bottom: 1px solid var(--border); }
.novel-header {
  padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  transition: background .12s;
}
.novel-header:hover { background: var(--surface2); }
.novel-header .arrow { font-size: 10px; color: var(--text2); transition: transform .15s; width: 12px; }
.novel-header .arrow.open { transform: rotate(90deg); }
.novel-header .count { font-size: 11px; color: var(--text2); margin-left: auto; }
.novel-chapters { display: none; }
.novel-chapters.open { display: block; }
.chapter-link {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px 6px 28px; cursor: pointer; font-size: 12px;
  transition: background .12s; color: var(--text2);
}
.chapter-link:hover { background: var(--surface2); color: var(--text); }
.chapter-link.active { background: var(--surface2); color: var(--accent); border-left: 3px solid var(--accent); padding-left: 25px; }
.chapter-link .ch-num { color: var(--text2); font-size: 10px; min-width: 22px; }
.chapter-link .ch-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Main Reading Area ── */
#main {
  flex: 1; overflow-y: auto; display: flex; justify-content: center;
  padding: 0 24px;
}
#reader-wrap {
  width: 100%; max-width: var(--read-max-w); padding: 32px 0 80px;
  display: flex; flex-direction: column;
}

/* ── Chapter Nav ── */
.chapter-nav {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin-bottom: 28px; flex-shrink: 0;
}
.chapter-nav button {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 6px 16px; border-radius: 4px; font-size: 13px; cursor: pointer;
  transition: background .12s, border-color .12s;
}
.chapter-nav button:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
.chapter-nav button:disabled { opacity: .3; cursor: not-allowed; }
.chapter-nav .nav-info { font-size: 13px; color: var(--text2); min-width: 120px; text-align: center; }

/* ── Chapter Header ── */
.chapter-header { margin-bottom: 24px; }
.chapter-header .ch-label { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
.chapter-header .ch-title-text { font-size: 22px; font-weight: 700; line-height: 1.4; }
.chapter-header .ch-meta { font-size: 12px; color: var(--text2); margin-top: 6px; }

/* ── Chapter Content ── */
#chapter-content {
  font-size: 16px; line-height: 2; color: var(--text);
  white-space: pre-wrap; word-break: break-word;
}
#chapter-content p { margin-bottom: 1em; }

/* ── Bottom Nav ── */
#bottom-nav {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border);
}

/* ── Empty State ── */
#empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--text2); gap: 8px;
}
#empty-state .icon { font-size: 48px; opacity: .3; }

/* ── Reading Controls ── */
#reading-controls {
  position: fixed; bottom: 20px; right: 24px;
  display: flex; gap: 4px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 4px; z-index: 50;
}
#reading-controls button {
  background: transparent; border: none; color: var(--text2);
  width: 32px; height: 32px; border-radius: 4px; cursor: pointer;
  font-size: 16px; transition: background .12s, color .12s;
  display: flex; align-items: center; justify-content: center;
}
#reading-controls button:hover { background: var(--surface2); color: var(--text); }
#reading-controls .ctrl-spacer { width: 1px; background: var(--border); margin: 4px 2px; }

/* ── Blueprint Panel ── */
#blueprint-toggle {
  position: fixed; bottom: 20px; right: 160px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); padding: 6px 12px; border-radius: var(--radius);
  font-size: 12px; cursor: pointer; z-index: 50;
  transition: background .12s, color .12s;
}
#blueprint-toggle:hover { background: var(--surface2); color: var(--text); }
#blueprint-toggle.active { color: var(--accent); border-color: var(--accent); }
#blueprint-panel {
  position: fixed; top: 48px; right: 0; bottom: 0;
  width: 360px; background: var(--surface); border-left: 1px solid var(--border);
  z-index: 49; transform: translateX(100%); transition: transform .2s;
  display: flex; flex-direction: column; overflow: hidden;
}
#blueprint-panel.open { transform: translateX(0); }
#blueprint-header {
  padding: 12px 14px; font-size: 12px; font-weight: 600;
  color: var(--text2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
#blueprint-header button {
  margin-left: auto; background: none; border: none; color: var(--text2);
  cursor: pointer; font-size: 16px;
}
#blueprint-content {
  flex: 1; overflow-y: auto; padding: 14px;
  font-size: 13px; line-height: 1.7; white-space: pre-wrap;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }

/* Loading */
#loading { text-align: center; padding: 40px; color: var(--text2); }

/* === 浮动改写工具条 === */
.rewrite-toolbar {
    position: fixed;
    z-index: 10000;
    background: #2a2a2a;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 8px 10px;
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    max-width: 420px;
}
.rewrite-toolbar.visible { display: flex; }
.rewrite-toolbar button {
    padding: 4px 10px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #333;
    color: #ddd;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
}
.rewrite-toolbar button:hover { background: #444; border-color: #888; }
.rewrite-toolbar button.primary { background: #4a90d9; border-color: #4a90d9; color: #fff; }
.rewrite-toolbar button.primary:hover { background: #5aa0e9; }
.rewrite-toolbar input[type="text"] {
    flex: 1;
    min-width: 120px;
    padding: 4px 8px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #1a1a1a;
    color: #ddd;
    font-size: 13px;
}
.rewrite-toolbar select {
    padding: 4px 8px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #333;
    color: #ddd;
    font-size: 13px;
}

/* === Diff 弹窗 === */
.diff-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 20000;
    justify-content: center;
    align-items: center;
}
.diff-overlay.visible { display: flex; }
.diff-modal {
    background: #1e1e1e;
    border: 1px solid #555;
    border-radius: 12px;
    width: 90vw;
    max-width: 1000px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.diff-header {
    padding: 12px 16px;
    border-bottom: 1px solid #444;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.diff-header h3 { margin: 0; color: #ddd; font-size: 16px; }
.diff-header button {
    padding: 6px 16px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #333;
    color: #ddd;
    cursor: pointer;
    font-size: 14px;
}
.diff-header button.apply-btn { background: #4caf50; border-color: #4caf50; color: #fff; }
.diff-header button.apply-btn:hover { background: #5cbf60; }
.diff-body {
    display: flex;
    flex: 1;
    overflow: hidden;
}
.diff-pane {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    font-size: 15px;
    line-height: 1.8;
    white-space: pre-wrap;
}
.diff-pane.left { border-right: 1px solid #444; background: #1a1a1a; color: #bbb; }
.diff-pane.right { background: #1a1a1a; color: #ddd; }
.diff-pane h4 { margin: 0 0 8px 0; color: #888; font-size: 13px; text-transform: uppercase; }
.diff-ins { background: rgba(76,175,80,0.25); border-radius: 2px; }
.diff-del { background: rgba(244,67,54,0.25); text-decoration: line-through; border-radius: 2px; }
.diff-eq { color: #999; }

/* Loading spinner for rewrite */
.rewrite-loading {
    display: none;
    position: fixed;
    z-index: 15000;
    background: #2a2a2a;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 8px 16px;
    color: #ddd;
    font-size: 13px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <h1>NoverGen 阅读器</h1>
  <span class="spacer"></span>
  <a class="nav-link" href="/">审阅器</a>
  <a class="nav-link" href="/generate.html">生成器</a>
  <a class="nav-link active" href="/reader.html">阅读器</a>
</div>

<!-- App -->
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">小说列表</div>
    <div id="novel-list"></div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="empty-state">
      <div class="icon">&#128214;</div>
      <div>从左侧选择一部小说开始阅读</div>
    </div>
    <div id="reader-wrap" style="display:none;"></div>
  </div>
</div>

<!-- Reading Controls -->
<div id="blueprint-toggle" onclick="toggleBlueprint()" title="查看章节蓝图">&#128196; 蓝图</div>
<div id="hook-toggle" onclick="toggleHookPanel()" title="查看钩子密度" style="position:fixed;bottom:20px;right:240px;background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:var(--radius);font-size:12px;cursor:pointer;z-index:50;">&#9878; 钩子</div>
<div id="constraint-toggle" onclick="toggleConstraintPanel()" title="查看审阅约束" style="position:fixed;bottom:20px;right:310px;background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:var(--radius);font-size:12px;cursor:pointer;z-index:50;">&#10003; 约束</div>
<div id="reading-controls">
  <button onclick="changeFontSize(-1)" title="缩小字号">A-</button>
  <button onclick="changeFontSize(1)" title="放大字号">A+</button>
  <span class="ctrl-spacer"></span>
  <button onclick="scrollToTop()" title="回到顶部">&#8593;</button>
</div>

<!-- Blueprint Panel -->
<div id="blueprint-panel">
  <div id="blueprint-header">
    章节蓝图
    <button onclick="toggleBlueprint()">&times;</button>
  </div>
  <div id="blueprint-content"></div>
</div>

<!-- Hook Density Panel -->
<div id="hook-panel" style="position:fixed;top:48px;right:0;bottom:0;width:300px;background:var(--surface);border-left:1px solid var(--border);z-index:48;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;overflow:hidden;">
  <div style="padding:12px 14px;font-size:12px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:8px;">
    钩子密度分析
    <button onclick="toggleHookPanel()" style="margin-left:auto;background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px;">&times;</button>
  </div>
  <div id="hook-panel-content" style="flex:1;overflow-y:auto;padding:14px;font-size:13px;"></div>
</div>

<!-- Constraint Panel (for P0-3) -->
<div id="constraint-panel" style="position:fixed;top:48px;right:0;bottom:0;width:360px;background:var(--surface);border-left:1px solid var(--border);z-index:48;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;overflow:hidden;">
  <div style="padding:12px 14px;font-size:12px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:8px;">
    审阅约束对照
    <button onclick="toggleConstraintPanel()" style="margin-left:auto;background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px;">&times;</button>
  </div>
  <div id="constraint-panel-content" style="flex:1;overflow-y:auto;padding:14px;font-size:13px;"></div>
</div>

<script>
// ── State ──
const state = {
  novels: [],
  currentNovel: null,
  currentChapter: 1,
  chapterCount: 0,
  titles: {},
  fontSize: 16,
};

// ── API ──
const API = {
  async get(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.statusText); return r.json(); },
};

// ── Rewrite State ──
let rewriteSelection = null;     // {text, startPos, endPos}
let rewriteResult = null;        // {original, rewritten}
let currentNovelName = '';
let currentChapterNum = 0;
let rewriteHistory = [];
let lastRewriteInstruction = '';

// ── Init ──
async function init() {
  // Restore reading position
  const saved = loadPosition();
  try {
    state.novels = await API.get('/api/novels');
    renderNovelList();
    if (state.novels.length === 0) {
      document.getElementById('novel-list').innerHTML =
        '<div style="padding:20px;color:var(--text2);font-size:13px;">暂无小说数据</div>';
      return;
    }
    // Restore previous reading position
    if (saved && saved.novel) {
      await selectNovel(saved.novel, saved.chapter || 1);
    }
  } catch (e) {
    document.getElementById('novel-list').innerHTML =
      '<div style="padding:20px;color:var(--red);font-size:13px;">加载失败: ' + e.message + '</div>';
  }
  loadStylePresets();
}

// ── Position persistence ──
function savePosition() {
  if (!state.currentNovel) return;
  const pos = {
    novel: state.currentNovel,
    chapter: state.currentChapter,
    scrollTop: document.getElementById('main').scrollTop,
    fontSize: state.fontSize,
  };
  localStorage.setItem('novergen_reader_pos', JSON.stringify(pos));
}

function loadPosition() {
  try {
    return JSON.parse(localStorage.getItem('novergen_reader_pos'));
  } catch (e) { return null; }
}

// Auto-save on scroll
let saveTimeout;
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('main').addEventListener('scroll', () => {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(savePosition, 500);
  });
});

// ── Novel List ──
function renderNovelList() {
  const list = document.getElementById('novel-list');
  list.innerHTML = state.novels.map(n => {
    const isOpen = state.currentNovel === n.name;
    return `<div class="novel-group">
      <div class="novel-header" onclick="toggleNovel('${escAttr(n.name)}')">
        <span class="arrow${isOpen ? ' open' : ''}">&#9654;</span>
        <span>${escHtml(n.name)}</span>
        <span class="count">${n.chapter_count}章</span>
      </div>
      <div class="novel-chapters${isOpen ? ' open' : ''}" id="chapters-${escAttr(n.name)}"></div>
    </div>`;
  }).join('');

  if (state.currentNovel) {
    renderChapterList(state.currentNovel);
  }
}

async function toggleNovel(name) {
  if (state.currentNovel === name) {
    state.currentNovel = null;
    renderNovelList();
    return;
  }
  await selectNovel(name);
}

async function selectNovel(name, targetChapter) {
  state.currentNovel = name;
  try {
    const info = await API.get(`/api/novels/${encodeURIComponent(name)}`);
    state.chapterCount = info.chapter_count;
    state.titles = {};
    info.chapters.forEach(c => { state.titles[c.n] = c.title; });
    renderNovelList();
    renderChapterList(name);

    const ch = targetChapter || state.currentChapter;
    if (ch >= 1 && ch <= state.chapterCount) {
      await loadChapter(Math.min(ch, state.chapterCount));
    } else if (state.chapterCount > 0) {
      await loadChapter(1);
    }
  } catch (e) {
    console.error('Failed to load novel:', e);
  }
}

function renderChapterList(name) {
  const container = document.getElementById('chapters-' + escAttr(name));
  if (!container) return;

  let html = '';
  for (let i = 1; i <= state.chapterCount; i++) {
    const title = state.titles[i] || '';
    const active = i === state.currentChapter ? ' active' : '';
    html += `<div class="chapter-link${active}" onclick="event.stopPropagation();loadChapter(${i})">
      <span class="ch-num">${i}.</span>
      <span class="ch-title">${escHtml(title || '第' + i + '章')}</span>
    </div>`;
  }
  container.innerHTML = html;
}

// ── Chapter Loading ──
async function loadChapter(n) {
  if (!state.currentNovel) return;
  state.currentChapter = n;
  currentNovelName = state.currentNovel;
  currentChapterNum = n;

  // Update chapter list highlighting
  renderChapterList(state.currentNovel);

  const main = document.getElementById('main');
  const empty = document.getElementById('empty-state');
  const wrap = document.getElementById('reader-wrap');

  empty.style.display = 'none';
  wrap.style.display = 'flex';
  wrap.innerHTML = '<div id="loading">加载中...</div>';
  main.scrollTop = 0;

  try {
    const ch = await API.get(`/api/novels/${encodeURIComponent(state.currentNovel)}/chapters/${n}`);
    renderChapter(ch);
    updateBlueprint(ch);
    loadConstraintStatus();
    savePosition();

    // Restore scroll position if same chapter
    const saved = loadPosition();
    if (saved && saved.novel === state.currentNovel && saved.chapter === n && saved.scrollTop) {
      setTimeout(() => { main.scrollTop = saved.scrollTop; }, 100);
    }
  } catch (e) {
    wrap.innerHTML = `<div style="text-align:center;padding:40px;color:var(--red);">加载失败: ${escHtml(e.message)}</div>`;
  }
}

function renderChapter(ch) {
  const wrap = document.getElementById('reader-wrap');
  const hasPrev = ch.n > 1;
  const hasNext = ch.n < state.chapterCount;

  // Format content: wrap paragraphs
  const paragraphs = ch.content.split('\n')
    .map(p => p.trim())
    .filter(p => p.length > 0)
    .map(p => `<p>${escHtml(p)}</p>`)
    .join('\n');

  // Word count (Chinese characters + words)
  const chineseChars = (ch.content.match(/[\u4e00-\u9fff]/g) || []).length;

  wrap.innerHTML = `
    <div class="chapter-nav">
      <button ${hasPrev ? '' : 'disabled'} onclick="loadChapter(${ch.n - 1})">&#8592; 上一章</button>
      <span class="nav-info">第 ${ch.n} / ${state.chapterCount} 章</span>
      <button ${hasNext ? '' : 'disabled'} onclick="loadChapter(${ch.n + 1})">下一章 &#8594;</button>
    </div>
    <div class="chapter-header">
      <div class="ch-label">第 ${ch.n} 章</div>
      <div class="ch-title-text">${escHtml(ch.title || '')}</div>
      <div class="ch-meta">${ch.char_count.toLocaleString()} 字符 | 约 ${chineseChars.toLocaleString()} 字</div>
    </div>
    <div id="chapter-content" style="font-size:${state.fontSize}px;">
      ${paragraphs}
    </div>
    <div id="bottom-nav" class="chapter-nav">
      <button ${hasPrev ? '' : 'disabled'} onclick="loadChapter(${ch.n - 1})">&#8592; 上一章</button>
      <span class="nav-info">第 ${ch.n} / ${state.chapterCount} 章</span>
      <button ${hasNext ? '' : 'disabled'} onclick="loadChapter(${ch.n + 1})">下一章 &#8594;</button>
    </div>
  `;
}

// ── Blueprint ──
let blueprintData = '';

async function updateBlueprint(ch) {
  if (!state.currentNovel) return;
  try {
    const dir = await API.get(`/api/novels/${encodeURIComponent(state.currentNovel)}/directory`);
    blueprintData = dir.content || '';
    // Extract current chapter blueprint
    const pattern = new RegExp(`第${ch.n}章[\\s\\S]*?(?=第${ch.n + 1}章|$)`, 'g');
    // Simpler approach: split by chapter headers and find the right one
    renderBlueprintForChapter(ch.n);
  } catch (e) {
    blueprintData = '';
  }
}

function renderBlueprintForChapter(n) {
  const content = document.getElementById('blueprint-content');
  if (!blueprintData) {
    content.innerHTML = '<div style="color:var(--text2);">暂无蓝图数据</div>';
    return;
  }
  // Find the section for this chapter
  const sections = blueprintData.split(/^(?=第\d+章)/m);
  let found = '';
  for (const sec of sections) {
    if (sec.trim().startsWith(`第${n}章`)) {
      found = sec.trim();
      break;
    }
  }
  if (!found) {
    // Fallback: show first few lines
    found = blueprintData.split('\n').slice(0, 20).join('\n');
  }
  content.textContent = found || '未找到本章蓝图';
}

function toggleBlueprint() {
  const panel = document.getElementById('blueprint-panel');
  const btn = document.getElementById('blueprint-toggle');
  panel.classList.toggle('open');
  btn.classList.toggle('active');
}

// ── Hook Panel ──
async function loadHookAnalysis() {
  if (!state.currentNovel) return;
  const panel = document.getElementById('hook-panel-content');
  panel.innerHTML = '<div style="color:var(--text2);">加载中...</div>';
  try {
    const report = await API.get('/api/novels/' + encodeURIComponent(state.currentNovel) + '/chapters/' + state.currentChapter + '/hooks');
    renderHookReport(report);
  } catch (e) {
    panel.innerHTML = '<div style="color:var(--red);">钩子分析失败: ' + escHtml(e.message) + '</div>';
  }
}

function renderHookReport(report) {
  const panel = document.getElementById('hook-panel-content');
  const score = report.score || 0;
  const scoreColor = score >= 70 ? 'var(--green)' : score >= 40 ? 'var(--amber)' : 'var(--red)';

  let html = '<div style="margin-bottom:12px;">' +
    '<div style="font-size:24px;font-weight:700;color:' + scoreColor + ';">' + score + '</div>' +
    '<div style="font-size:11px;color:var(--text2);">钩子评分 / 100</div>' +
    '</div>';

  html += '<div style="margin-bottom:12px;font-size:12px;">' +
    '<div>密度: ' + (report.density || 0).toFixed(1) + ' 个/千字</div>' +
    '<div>章末强力钩子: ' + (report.end_cliffhanger ? '<span style="color:var(--green);">有</span>' : '<span style="color:var(--red);">无</span>') + '</div>' +
    '</div>';

  if (report.distribution) {
    html += '<div style="margin-bottom:12px;font-size:12px;">分布: ' +
      '前1/3: ' + (report.distribution['前1/3'] || 0) + ' | ' +
      '中1/3: ' + (report.distribution['中1/3'] || 0) + ' | ' +
      '后1/3: ' + (report.distribution['后1/3'] || 0) +
      '</div>';
  }

  if (report.hooks && report.hooks.length > 0) {
    html += '<div style="font-size:12px;font-weight:600;margin-bottom:6px;color:var(--text2);">钩子列表</div>';
    report.hooks.forEach(h => {
      const color = h.strength >= 0.7 ? 'var(--green)' : h.strength >= 0.4 ? 'var(--amber)' : 'var(--text2)';
      html += '<div style="padding:4px 0;border-bottom:1px solid var(--border);font-size:11px;">' +
        '<span style="color:' + color + ';font-weight:600;">' + h.type + '</span> ' +
        '<span style="color:var(--text2);">(' + h.strength + ')</span>' +
        '<div style="color:var(--text2);">' + escHtml(h.text_snippet || '') + '</div>' +
        '</div>';
    });
  }

  if (report.summary) {
    html += '<div style="margin-top:8px;font-size:11px;color:var(--text2);">' + escHtml(report.summary) + '</div>';
  }

  panel.innerHTML = html;
}

function toggleHookPanel() {
  const panel = document.getElementById('hook-panel');
  const btn = document.getElementById('hook-toggle');
  const isOpen = panel.style.transform === 'translateX(0px)';
  panel.style.transform = isOpen ? 'translateX(100%)' : 'translateX(0px)';
  if (!isOpen) {
    loadHookAnalysis();
    btn.style.color = 'var(--accent)';
    btn.style.borderColor = 'var(--accent)';
  } else {
    btn.style.color = 'var(--text2)';
    btn.style.borderColor = 'var(--border)';
  }
}

// ── Constraint Panel ──
async function loadConstraintStatus() {
  if (!state.currentNovel) return;

  try {

      clist.forEach((c, i) => {

          '<span style="color:' + (isCritical ? 'var(--red)' : 'var(--amber)') + ';font-weight:600;">[' + (isCritical ? 'CRITICAL' : 'SUGGESTION') + ']</span> ' +
          '<span style="color:var(--text2);">' + escHtml(c.section || '') + '</span>' +
          '<div style="margin-top:2px;">' + escHtml(c.constraint_text || '') + '</div>' +
          '</div>';

function toggleConstraintPanel() {
  const panel = document.getElementById('constraint-panel');
  const btn = document.getElementById('constraint-toggle');
  const isOpen = panel.style.transform === 'translateX(0px)';
  panel.style.transform = isOpen ? 'translateX(100%)' : 'translateX(0px)';
  if (!isOpen) {
    btn.style.color = 'var(--accent)';
    btn.style.borderColor = 'var(--accent)';
  } else {
    btn.style.color = 'var(--text2)';
    btn.style.borderColor = 'var(--border)';
  }
}

// ── Font Size ──
function changeFontSize(delta) {
  state.fontSize = Math.max(12, Math.min(24, state.fontSize + delta));
  const content = document.getElementById('chapter-content');
  if (content) content.style.fontSize = state.fontSize + 'px';
  savePosition();
}

function scrollToTop() {
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Keyboard Shortcuts ──
document.addEventListener('keydown', function(e) {
  // Ctrl+Enter: trigger rewrite with custom instruction (works even in inputs)
  if (e.ctrlKey && e.key === 'Enter' && rewriteSelection) {
    e.preventDefault();
    rewriteCustom();
    return;
  }

  // Don't capture when typing in inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'ArrowRight' && state.currentChapter < state.chapterCount) {
    e.preventDefault();
    loadChapter(state.currentChapter + 1);
  } else if (e.key === 'ArrowLeft' && state.currentChapter > 1) {
    e.preventDefault();
    loadChapter(state.currentChapter - 1);
  }
});

// ── Rewrite Functions ──

// Load style presets from API
async function loadStylePresets() {
    try {
        const res = await fetch('/api/style-presets');
        const data = await res.json();
        const sel = document.getElementById('rewriteStyleSelect');
        data.presets.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.name;
            sel.appendChild(opt);
        });
    } catch (e) {
        console.error('Failed to load style presets:', e);
    }
}

// Listen for text selection
document.addEventListener('mouseup', function(e) {
    // Small delay to let the selection settle
    setTimeout(() => {
        const selection = window.getSelection();
        const text = selection.toString().trim();

        if (text.length < 5 || text.length > 2000) {
            document.getElementById('rewriteToolbar').classList.remove('visible');
            return;
        }

        // Ensure selection is within chapter content
        const contentArea = document.getElementById('chapter-content');
        if (!contentArea) return;
        if (!contentArea.contains(selection.anchorNode)) return;

        // Calculate offset in full text
        const fullText = contentArea.textContent;
        const anchorOffset = getTextOffset(contentArea, selection.anchorNode, selection.anchorOffset);
        const focusOffset = getTextOffset(contentArea, selection.focusNode, selection.focusOffset);
        const startPos = Math.min(anchorOffset, focusOffset);
        const endPos = Math.max(anchorOffset, focusOffset);

        rewriteSelection = {
            text: text,
            startPos: startPos,
            endPos: endPos
        };

        // Position the toolbar
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        const toolbar = document.getElementById('rewriteToolbar');
        toolbar.style.left = Math.min(rect.left, window.innerWidth - 430) + 'px';
        toolbar.style.top = (rect.bottom + 8) + 'px';
        toolbar.classList.add('visible');

        // Clear custom input
        document.getElementById('rewriteCustomInput').value = '';
    }, 10);
});

// Get text offset of a node within a root element
function getTextOffset(root, node, offset) {
    let total = 0;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
        if (walker.currentNode === node) {
            return total + offset;
        }
        total += walker.currentNode.textContent.length;
    }
    return total;
}

// Hide toolbar when clicking elsewhere
document.addEventListener('mousedown', function(e) {
    const toolbar = document.getElementById('rewriteToolbar');
    if (toolbar && !toolbar.contains(e.target)) {
        toolbar.classList.remove('visible');
    }
});

// Rewrite with a style preset
function rewriteWithStyle(styleId) {
    document.getElementById('rewriteStyleSelect').value = styleId;
    document.getElementById('rewriteToolbar').classList.remove('visible');
    executeRewrite(styleId, '');
}

// Rewrite with custom instruction
function rewriteCustom() {
    const input = document.getElementById('rewriteCustomInput');
    const instruction = input.value.trim();
    if (!instruction) return;
    const styleId = document.getElementById('rewriteStyleSelect').value;
    document.getElementById('rewriteToolbar').classList.remove('visible');
    executeRewrite(styleId, instruction);
}

async function executeRewrite(styleId, instruction) {
    if (!rewriteSelection) return;

    const contentArea = document.getElementById('chapter-content');
    const fullText = contentArea.textContent;

    // If no custom instruction, use style name as default
    if (!instruction) {
        const sel = document.getElementById('rewriteStyleSelect');
        const opt = sel.selectedOptions[0];
        instruction = opt ? opt.textContent : '请改写这段文字';
    }

    // Show loading
    document.getElementById('rewriteLoading').style.display = 'block';
    lastRewriteInstruction = instruction;

    try {
        const res = await fetch('/api/rewrite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chapter_text: fullText,
                start_pos: rewriteSelection.startPos,
                end_pos: rewriteSelection.endPos,
                instruction: instruction,
                style_id: styleId
            })
        });
        const data = await res.json();
        rewriteResult = data;

        // Render diff modal
        renderDiff(data.original, data.rewritten);
        setupSyncScroll();
        document.getElementById('diffOverlay').classList.add('visible');
    } catch (e) {
        alert('改写失败: ' + e.message);
    } finally {
        document.getElementById('rewriteLoading').style.display = 'none';
    }
}

// Sentence-level diff: split by punctuation, diff whole sentences
function splitSentences(text) {
    const result = [];
    let current = '';
    for (const ch of [...text]) {
        current += ch;
        if ('。！？…'.includes(ch)) {
            result.push(current);
            current = '';
        }
    }
    if (current) result.push(current);
    return result;
}

function computeDiff(original, rewritten) {
    const origSents = splitSentences(original);
    const newSents = splitSentences(rewritten);

    // Find common sentence prefix
    let sentPrefixLen = 0;
    while (sentPrefixLen < origSents.length && sentPrefixLen < newSents.length
           && origSents[sentPrefixLen] === newSents[sentPrefixLen]) {
        sentPrefixLen++;
    }

    // Find common sentence suffix
    let sentSuffixLen = 0;
    while (sentSuffixLen < origSents.length - sentPrefixLen
           && sentSuffixLen < newSents.length - sentPrefixLen
           && origSents[origSents.length - 1 - sentSuffixLen] === newSents[newSents.length - 1 - sentSuffixLen]) {
        sentSuffixLen++;
    }

    return {
        prefixSents: origSents.slice(0, sentPrefixLen),
        deletedSents: origSents.slice(sentPrefixLen, origSents.length - sentSuffixLen),
        insertedSents: newSents.slice(sentPrefixLen, newSents.length - sentSuffixLen),
        suffixSents: origSents.slice(origSents.length - sentSuffixLen)
    };
}

function renderDiff(original, rewritten) {
    const diff = computeDiff(original, rewritten);

    // Original side
    let origHTML = '';
    if (diff.prefixSents.length) origHTML += '<span class="diff-eq">' + escHtml(diff.prefixSents.join('')) + '</span>';
    if (diff.deletedSents.length) origHTML += '<span class="diff-del">' + escHtml(diff.deletedSents.join('')) + '</span>';
    if (diff.suffixSents.length) origHTML += '<span class="diff-eq">' + escHtml(diff.suffixSents.join('')) + '</span>';
    document.getElementById('diffOriginal').innerHTML = origHTML;

    // Rewritten side
    let newHTML = '';
    if (diff.prefixSents.length) newHTML += '<span class="diff-eq">' + escHtml(diff.prefixSents.join('')) + '</span>';
    if (diff.insertedSents.length) newHTML += '<span class="diff-ins">' + escHtml(diff.insertedSents.join('')) + '</span>';
    if (diff.suffixSents.length) newHTML += '<span class="diff-eq">' + escHtml(diff.suffixSents.join('')) + '</span>';
    document.getElementById('diffRewritten').innerHTML = newHTML;

    // Update undo button state
    document.getElementById('undoRewriteBtn').disabled = (rewriteHistory.length === 0);
}

function setupSyncScroll() {
    const leftPane = document.querySelector('.diff-pane.left');
    const rightPane = document.querySelector('.diff-pane.right');
    if (!leftPane || !rightPane) return;

    let syncing = false;
    leftPane.onscroll = function() {
        if (syncing) return;
        syncing = true;
        rightPane.scrollTop = leftPane.scrollTop;
        syncing = false;
    };
    rightPane.onscroll = function() {
        if (syncing) return;
        syncing = true;
        leftPane.scrollTop = rightPane.scrollTop;
        syncing = false;
    };
}

function closeDiff() {
    document.getElementById('diffOverlay').classList.remove('visible');
}

async function applyRewrite() {
    if (!rewriteResult) return;

    const contentArea = document.getElementById('chapter-content');
    const fullText = contentArea.textContent;

    // Get edited text from contentEditable pane
    const rewrittenPane = document.getElementById('diffRewritten');
    const editedText = rewrittenPane.textContent;

    const newText = fullText.substring(0, rewriteSelection.startPos)
        + editedText
        + fullText.substring(rewriteSelection.endPos);

    // Push to history before applying
    rewriteHistory.push({
        chapterNum: currentChapterNum,
        novelName: currentNovelName,
        originalText: fullText,
        newText: newText,
        startPos: rewriteSelection.startPos,
        endPos: rewriteSelection.endPos,
        timestamp: Date.now()
    });

    // Save to server
    try {
        const res = await fetch('/api/novels/' + encodeURIComponent(currentNovelName) + '/chapters/' + currentChapterNum, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: newText })
        });
        if (!res.ok) throw new Error('Failed to save');

        // Data flywheel: log rewrite record (fire-and-forget)
        fetch('/api/rewrite-log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                novel_name: currentNovelName,
                chapter_num: currentChapterNum,
                original_text: rewriteResult.original,
                instruction: lastRewriteInstruction,
                ai_rewritten: rewriteResult.rewritten,
                user_edited: editedText
            })
        }).catch(() => {});
    } catch (e) {
        alert('保存失败: ' + e.message);
        rewriteHistory.pop();
        return;
    }

    // Update local display - rebuild paragraphs
    const paragraphs = newText.split('\n')
        .map(p => p.trim())
        .filter(p => p.length > 0)
        .map(p => `<p>${escHtml(p)}</p>`)
        .join('\n');
    contentArea.innerHTML = paragraphs;

    closeDiff();
    rewriteResult = null;
    rewriteSelection = null;
}

async function undoLastRewrite() {
    if (!rewriteHistory.length) return;

    const last = rewriteHistory.pop();

    // Restore original to server
    try {
        const res = await fetch('/api/novels/' + encodeURIComponent(last.novelName) + '/chapters/' + last.chapterNum, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: last.originalText })
        });
        if (!res.ok) throw new Error('Failed to save');
    } catch (e) {
        alert('撤销失败: ' + e.message);
        rewriteHistory.push(last);
        return;
    }

    // Update local display
    const contentArea = document.getElementById('chapter-content');
    const paragraphs = last.originalText.split('\n')
        .map(p => p.trim())
        .filter(p => p.length > 0)
        .map(p => `<p>${escHtml(p)}</p>`)
        .join('\n');
    contentArea.innerHTML = paragraphs;

    closeDiff();
    rewriteResult = null;
    rewriteSelection = null;
}

// ── Helpers ──
function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
function escAttr(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

// ── Init ──
init();
</script>
